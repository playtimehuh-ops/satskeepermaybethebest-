name: build-apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend automatic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run offline API smoke tests
        run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_BASE: ${{ secrets.API_BASE }}
      APP_KEY: ${{ secrets.APP_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: mistralai/mistral-large-4-1t-a52b
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.x
          cache: true

      - name: Check secrets
        run: |
          test -n "$API_BASE" || { echo "Missing API_BASE secret"; exit 1; }
          test -n "$APP_KEY" || { echo "Missing APP_KEY secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing SUPABASE_URL secret"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing SUPABASE_ANON_KEY secret"; exit 1; }

      - name: Prepare release keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release keystore."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. The APK is debug-signed. Fine for testing, not for real users."
          fi

      - name: Generate Flutter scaffold around the committed files
        run: |
          flutter create --org com --project-name satskeeper --platforms=android --empty "$RUNNER_TEMP/scaffold"
          rsync -a --ignore-existing "$RUNNER_TEMP/scaffold/" ./
          rm -f android/app/build.gradle.kts
          rm -rf test analysis_options.yaml

      - name: Fetch the Bricolage Grotesque variable font
        run: |
          mkdir -p assets/fonts
          curl -fsSL -o assets/fonts/Bricolage.ttf "https://github.com/google/fonts/raw/main/ofl/bricolagegrotesque/BricolageGrotesque%5Bopsz%2Cwdth%2Cwght%5D.ttf" \
            || { echo "Font download failed; falling back to a system font"; cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/fonts/Bricolage.ttf; }

      - name: Get Dart dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE="$API_BASE"
          --dart-define=APP_KEY="$APP_KEY"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      # GitHub-hosted Linux runners may expose /dev/kvm without granting
      # the runner user access. Fix permissions before starting the emulator.
      - name: Enable KVM access for Android emulator
        if: vars.RUN_AI_EMULATOR_TEST == 'true' && env.NVIDIA_API_KEY != ''
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            if command -v kvm-ok >/dev/null 2>&1; then kvm-ok || true; fi
          else
            echo "::error::This runner has no /dev/kvm device; hardware-accelerated Android emulation is unavailable."
            exit 1
          fi

      # Build a separate emulator-only APK with non-production endpoints.
      # The distributable release APK above keeps its configured release settings.
      - name: Build isolated AI-test APK
        if: vars.RUN_AI_EMULATOR_TEST == 'true' && env.NVIDIA_API_KEY != ''
        run: |
          flutter build apk --debug --target-platform android-x64 \
            --dart-define=API_BASE=https://example.invalid \
            --dart-define=APP_KEY=ai-test-only \
            --dart-define=SUPABASE_URL=https://example.invalid \
            --dart-define=SUPABASE_ANON_KEY=ai-test-only

      - name: Run NVIDIA vision agent in Android emulator
        if: vars.RUN_AI_EMULATOR_TEST == 'true' && env.NVIDIA_API_KEY != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb start-server
            adb reconnect offline || true
            adb wait-for-device
            for attempt in $(seq 1 120); do booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"; [ "$booted" = "1" ] && break; sleep 5; done
            test "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            python3 tests/ai_android_agent.py

      - name: Explain skipped AI emulator test
        if: vars.RUN_AI_EMULATOR_TEST != 'true' || env.NVIDIA_API_KEY == ''
        run: echo "::notice::AI emulator test is opt-in. Set repository variable RUN_AI_EMULATOR_TEST=true and configure NVIDIA_API_KEY to enable it. APK build is independent."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-android-report
          path: ai-android-report.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: satskeeper-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: satskeeper-symbols
          path: build/symbols
          retention-days: 30
          if-no-files-found: warn
