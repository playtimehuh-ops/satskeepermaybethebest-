name: gaindeep
description: Share spare bandwidth and redeem it for gift cards and mobile top-ups.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage.ttf
