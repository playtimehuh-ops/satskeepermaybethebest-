plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing comes from the environment (set by the CI workflow from GitHub secrets).
def keystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace "com.satskeeper"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.satskeeper"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Real keystore when provided; otherwise debug-signed so the APK still installs.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
            // The Go (gomobile) bindings are reached through JNI; do not shrink them.
            minifyEnabled false
            shrinkResources false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

flutter {
    source "../.."
}

dependencies {
    // Mysterium Network provider node (gomobile AAR).
    implementation "network.mysterium:provider-mobile-node:1.30.3"
    implementation "androidx.core:core-ktx:1.13.1"
}
