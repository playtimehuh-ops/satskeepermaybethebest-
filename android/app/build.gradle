plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing comes from the environment (set by the CI workflow from GitHub secrets).
def keystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace "com.satskeeper"
    compileSdk flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Work around an AndroidX Lifecycle lint detector crash with AGP 8.7.x.
    // This disables only the crashing lint rule; Kotlin compilation remains enabled.
    lint {
        disable "NullSafeMutableLiveData"
    }

    defaultConfig {
        applicationId "com.satskeeper"
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Real keystore when provided; otherwise debug-signed so the APK still installs.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
            // The Go (gomobile) bindings are reached through JNI; do not shrink them.
            minifyEnabled false
            shrinkResources false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

// Pin AndroidX Browser below 1.9.0: 1.9.0 requires AGP 8.9.1 and
// compileSdk 36, while this Flutter project currently uses AGP 8.7.3 / SDK 35.
configurations.configureEach {
    resolutionStrategy.force "androidx.browser:browser:1.8.0"
}

flutter {
    source "../.."
}

dependencies {
    // Mysterium Network provider node (gomobile AAR).
    implementation "network.mysterium:provider-mobile-node:1.30.3"
    implementation "androidx.core:core-ktx:1.13.1"

    // Supabase Kotlin client used by the custom proxy foreground service.
    implementation platform("io.github.jan-tennert.supabase:bom:3.2.4")
    implementation "io.github.jan-tennert.supabase:postgrest-kt"
    implementation "io.github.jan-tennert.supabase:realtime-kt"
    implementation "io.ktor:ktor-client-okhttp:3.1.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
}
